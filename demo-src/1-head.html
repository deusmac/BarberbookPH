<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BarberBook PH - Interactive Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800;900&display=swap">
<style>
/* ===== TOKENS / CSS ===== */
:root{
  --blue:#1E50FF; --yellow:#FFE600; --yellow-hover:#EDD400; --yellow-soft:#FEF08A; --ice:#E2F1F8;
  --card:#FFFFFF; --ink:#000000; --ink-2:#111827; --muted:#333333;
  --green:#22C55E; --red:#EF4444; --amber:#F59E0B;
  --bw:2.5px; --r-sm:8px; --r-md:12px; --r-lg:16px; --r-pill:9999px;
  --sh-sm:2px 2px 0 #000; --sh-md:4px 4px 0 #000; --sh-lg:6px 6px 0 #000; --sh-xl:8px 8px 0 #000;
  --font:'Outfit','Poppins','Segoe UI',Arial,sans-serif; --ease:cubic-bezier(.2,.9,.3,1.2);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);font-weight:500;color:var(--ink-2);background:var(--blue);display:flex;flex-direction:column;height:100dvh;overflow:hidden;font-size:15px;line-height:1.35}
body.role-o{background:var(--ice)}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;background:none;border:0}
input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
h1,h2,h3,h4{font-weight:900;text-transform:uppercase;letter-spacing:-0.02em;line-height:1.05}
h1{font-size:30px} h2{font-size:22px} h3{font-size:17px} h4{font-size:14px}
:focus-visible{outline:3px solid #000;outline-offset:2px;background-clip:padding-box}
.ic{flex:none;vertical-align:middle}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.muted{color:var(--muted)} .small{font-size:12.5px} .tiny{font-size:11px} .b{font-weight:800} .up{text-transform:uppercase}
.row{display:flex;align-items:center;gap:8px} .col{display:flex;flex-direction:column;gap:10px} .wrap{flex-wrap:wrap} .grow{flex:1;min-width:0} .sp{justify-content:space-between}
.hide{display:none!important}

/* demo bar */
#demobar{flex:none;background:#000;color:var(--yellow);display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:7px 12px;font-weight:800;font-size:12.5px;letter-spacing:.02em;text-transform:uppercase;z-index:30}
#demobar .ttl{margin-right:auto}
.seg-dark{display:flex;border:2px solid var(--yellow);border-radius:8px;overflow:hidden}
.seg-dark button{padding:5px 10px;font-weight:800;text-transform:uppercase;font-size:12px;color:var(--yellow)}
.seg-dark button.on{background:var(--yellow);color:#000}
.dbtn{border:2px solid var(--yellow);border-radius:8px;padding:5px 10px;font-weight:800;text-transform:uppercase;font-size:12px;color:var(--yellow)}
.dbtn:hover{background:var(--yellow);color:#000}
.dbtn.on{background:var(--yellow);color:#000}
#stage{flex:1;min-height:0;overflow:auto;position:relative}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--yellow);color:#000;border:var(--bw) solid #000;border-radius:10px;box-shadow:var(--sh-md);padding:10px 16px;font-weight:800;text-transform:uppercase;letter-spacing:-0.01em;transition:transform 120ms,box-shadow 120ms,background 120ms;min-height:44px;text-align:center}
.btn:hover{transform:translate(-2px,-2px);box-shadow:var(--sh-lg);background:var(--yellow-hover)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #000}
.btn.secondary{background:#fff}.btn.secondary:hover{background:#f6f6f6}
.btn.danger{background:var(--red);color:#fff}.btn.danger:hover{background:#dc2626}
.btn.green{background:var(--green)}
.btn.sm{padding:6px 12px;min-height:36px;font-size:13px;box-shadow:var(--sh-sm)}
.btn.block{display:flex;width:100%}
.btn.icon{width:44px;padding:0}
.btn[disabled]{opacity:.45;pointer-events:none}
.card{background:#fff;border:var(--bw) solid #000;border-radius:14px;box-shadow:var(--sh-md);padding:14px}
.card.hover{transition:transform 120ms,box-shadow 120ms;cursor:pointer;text-align:left;width:100%;display:block}
.card.hover:hover{transform:translate(-2px,-2px);box-shadow:var(--sh-lg)}
.card.yellow{background:var(--yellow)} .card.soft{background:var(--yellow-soft)} .card.ice{background:var(--ice)}
.chip{display:inline-flex;align-items:center;gap:6px;border:2px solid #000;border-radius:var(--r-pill);padding:5px 12px;font-weight:700;background:#fff;font-size:13.5px;min-height:34px}
.chip.on{background:var(--blue);color:#fff;box-shadow:var(--sh-sm)}
.badge{display:inline-block;border:2px solid #000;background:var(--yellow-soft);box-shadow:var(--sh-sm);padding:2px 8px;font-size:10.5px;font-weight:900;text-transform:uppercase;letter-spacing:.02em;transform:rotate(-3deg);border-radius:4px;white-space:nowrap}
.badge.r{transform:rotate(3deg)} .badge.g{background:var(--green)} .badge.b{background:var(--blue);color:#fff} .badge.y{background:var(--yellow)}
.input,.select,.textarea{width:100%;background:#fff;border:2px solid #000;border-radius:8px;padding:9px 11px;font-weight:600;min-height:42px}
.textarea{resize:vertical;min-height:80px}
.input:focus,.select:focus,.textarea:focus{background:#FFFAEC;outline:2px solid #000;outline-offset:2px}
label.lbl{display:block;font-weight:800;font-size:12.5px;text-transform:uppercase;margin-bottom:4px}
.stepper{display:inline-flex;align-items:center;gap:10px}
.stepper button{width:40px;height:40px;border:2px solid #000;background:#fff;border-radius:8px;box-shadow:var(--sh-sm);font-weight:900;font-size:20px;display:grid;place-items:center}
.stepper button:active{transform:translate(2px,2px);box-shadow:none}
.stepper .val{min-width:44px;text-align:center;font-weight:900;font-size:26px}
.toggle{width:50px;height:28px;border:2px solid #000;border-radius:var(--r-pill);background:#fff;position:relative;flex:none;transition:background 120ms}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;background:#000;border-radius:50%;transition:transform 140ms var(--ease)}
.toggle.on{background:var(--yellow)}.toggle.on::after{transform:translateX(22px)}
.segmented{display:flex;border:2px solid #000;border-radius:10px;overflow:hidden;background:#fff}
.segmented button{flex:1;padding:8px 6px;font-weight:800;font-size:13px;border-right:2px solid #000;text-transform:uppercase}
.segmented button:last-child{border-right:0}
.segmented button.on{background:var(--yellow);box-shadow:inset 0 0 0 0 #000}
.stepbar{display:flex;align-items:center;padding:6px 4px 2px}
.stepbar .st{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:800;text-transform:uppercase}
.stepbar .dot{width:30px;height:30px;border:2.5px solid #000;border-radius:50%;display:grid;place-items:center;font-weight:900;background:#fff}
.stepbar .st.cur .dot{background:var(--yellow);box-shadow:var(--sh-sm)}
.stepbar .st.done .dot{background:#000;color:var(--yellow)}
.stepbar .ln{flex:1;height:3px;background:#000;margin:0 4px 14px}
.empty{text-align:center;padding:26px 10px;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty .ic{opacity:.8}
.st-pill{display:inline-block;border:2px solid #000;border-radius:var(--r-pill);padding:1px 9px;font-size:11.5px;font-weight:800;text-transform:uppercase;white-space:nowrap}
.st-pending{background:var(--amber)} .st-confirmed{background:var(--blue);color:#fff} .st-inchair{background:var(--yellow)}
.st-done{background:var(--green)} .st-cancelled{background:#cfcfcf;text-decoration:line-through} .st-noshow{background:var(--red);color:#fff}

/* toasts / modal */
#toasts{position:fixed;top:56px;right:12px;display:flex;flex-direction:column;gap:8px;z-index:80;width:min(340px,calc(100vw - 24px));pointer-events:none}
.toast{display:flex;background:#fff;border:var(--bw) solid #000;border-radius:12px;box-shadow:var(--sh-md);overflow:hidden;pointer-events:auto;animation:tin 260ms var(--ease)}
.toast .ti{width:44px;display:grid;place-items:center;border-right:var(--bw) solid #000;background:var(--green)}
.toast.amber .ti{background:var(--amber)} .toast.red .ti{background:var(--red);color:#fff} .toast.blue .ti{background:var(--blue);color:#fff}
.toast .tb{padding:9px 12px;font-weight:700;font-size:13.5px}
.toast.out{opacity:0;transform:translateX(30px);transition:all 240ms}
@keyframes tin{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
@media (max-width:767px){#toasts{right:50%;transform:translateX(50%)}}
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:60;display:grid;place-items:center;padding:14px}
.modal{background:#fff;border:var(--bw) solid #000;border-radius:16px;box-shadow:var(--sh-xl);padding:18px;width:min(460px,100%);max-height:90dvh;overflow:auto;animation:up 200ms var(--ease)}
.modal h2{margin-bottom:10px}
.drawer-bd{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--ice);border-left:3px solid #000;z-index:41;overflow:auto;padding:16px;animation:slide 220ms var(--ease)}
@keyframes slide{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes up{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
.enter{animation:up 200ms var(--ease)}
.stag>*{animation:up 240ms var(--ease) both}
.stag>*:nth-child(2){animation-delay:40ms}.stag>*:nth-child(3){animation-delay:80ms}.stag>*:nth-child(4){animation-delay:120ms}
.stag>*:nth-child(5){animation-delay:160ms}.stag>*:nth-child(6){animation-delay:200ms}.stag>*:nth-child(7){animation-delay:240ms}.stag>*:nth-child(8){animation-delay:280ms}
.pop{animation:pop 260ms var(--ease)}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.05)}100%{transform:scale(1)}}
.stamp{animation:stamp 520ms var(--ease) both}
@keyframes stamp{0%{transform:scale(0) rotate(-20deg)}70%{transform:scale(1.15) rotate(6deg)}100%{transform:scale(1) rotate(0)}}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:30%;left:50%;width:9px;height:9px;border:1.5px solid #000;animation:cf 900ms ease-out forwards}
@keyframes cf{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}
.flash{animation:flash 1.2s ease-out}
@keyframes flash{0%,40%{background:var(--yellow)}100%{}}
.wig{animation:wig 700ms var(--ease)}
@keyframes wig{0%{transform:rotate(-12deg) scale(0)}60%{transform:rotate(6deg) scale(1.2)}100%{transform:rotate(-3deg) scale(1)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* phone frame + customer app */
.cwrap{display:flex;justify-content:center;align-items:flex-start;gap:28px;padding:22px 14px;min-height:100%}
.phone-frame{width:390px;height:844px;flex:none;border:3px solid #000;border-radius:36px;box-shadow:var(--sh-xl);overflow:hidden;background:#fff;display:flex;flex-direction:column;position:relative}
.pstatus{flex:none;background:#000;color:#fff;font-weight:800;font-size:12px;display:flex;justify-content:space-between;padding:6px 20px}
.capp{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--ice);position:relative}
.cbar{flex:none;background:var(--yellow);border-bottom:3px solid #000;display:flex;align-items:center;gap:8px;padding:8px 12px}
.logo{font-weight:900;font-size:21px;letter-spacing:-0.03em;text-transform:uppercase}
.logo b{color:var(--blue);font-weight:900}
.cbody{flex:1;min-height:0;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:14px}
.ctabs{flex:none;display:grid;grid-template-columns:repeat(4,1fr);border-top:3px solid #000;background:#fff}
.ctabs button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;font-size:11px;font-weight:800;text-transform:uppercase;border-right:2px solid #000}
.ctabs button:last-child{border-right:0}
.ctabs button.on{background:var(--yellow)}
.hero{background:var(--blue);color:#fff;border:var(--bw) solid #000;border-radius:14px;box-shadow:var(--sh-md);padding:16px}
.hero h1{font-size:27px;margin-bottom:12px}
.hero .input{color:#000}
.notice{background:var(--yellow-soft);border:2px dashed #000;border-radius:10px;padding:8px 10px;font-weight:700;font-size:12.5px}
.side{width:300px;flex:none;position:sticky;top:22px}
.side ul{padding-left:18px;display:flex;flex-direction:column;gap:7px;margin-top:8px;font-weight:600}
.styles-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.scard{border:var(--bw) solid #000;border-radius:12px;background:#fff;box-shadow:var(--sh-sm);padding:8px;text-align:left;position:relative;display:flex;flex-direction:column;gap:5px;transition:transform 120ms,box-shadow 120ms}
.scard:hover{transform:translate(-2px,-2px);box-shadow:var(--sh-md)}
.scard.sel{background:var(--yellow);box-shadow:var(--sh-lg)}
.scard .art{border:2px solid #000;border-radius:8px;overflow:hidden;background:var(--ice);line-height:0}
.scard .art svg,.art svg{width:100%;height:auto}
.scard .chk{position:absolute;top:-8px;right:-8px;width:28px;height:28px;border:2.5px solid #000;border-radius:50%;background:#000;color:var(--yellow);display:grid;place-items:center}
.scard .bd{position:absolute;top:-8px;left:-6px}
.bcard{border:var(--bw) solid #000;border-radius:12px;background:#fff;padding:10px;display:flex;gap:10px;align-items:center;text-align:left;width:100%;box-shadow:var(--sh-sm);transition:transform 120ms,box-shadow 120ms}
.bcard:hover{transform:translate(-2px,-2px);box-shadow:var(--sh-md)}
.bcard.sel{background:var(--yellow);box-shadow:var(--sh-lg)}
.avatar{width:46px;height:46px;border-radius:50%;border:2.5px solid #000;display:grid;place-items:center;font-weight:900;font-size:16px;flex:none}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .dh{font-size:10.5px;font-weight:900;text-align:center;text-transform:uppercase}
.cal button{aspect-ratio:1;border:2px solid #000;border-radius:8px;background:#fff;font-weight:800;position:relative;font-size:14px}
.cal button.on{background:var(--yellow);box-shadow:var(--sh-sm)}
.cal button[disabled]{background:#e8e8e8;color:#777;border-color:#777;cursor:not-allowed}
.cal button.today{box-shadow:inset 0 -4px 0 var(--blue)}
.cal .full{position:absolute;bottom:0;left:0;right:0;font-size:8px;font-weight:900;background:#000;color:#fff;line-height:11px}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{border:2px solid #000;border-radius:8px;background:#fff;padding:7px 2px;font-weight:800;font-size:13px;text-align:center;line-height:1.15}
.slot:hover{box-shadow:var(--sh-sm)}
.slot.on{background:var(--yellow);box-shadow:var(--sh-md);transform:scale(1.04)}
.slot.taken{background:#e8e8e8;color:#666;text-decoration:line-through;border-color:#666;cursor:not-allowed;box-shadow:none}
.slot.taken small{display:block;text-decoration:none;font-size:9px;font-weight:800;text-transform:uppercase}
.sumrow{display:flex;gap:10px;padding:8px 0;border-bottom:2px dashed #000}
.sumrow:last-child{border:0}.sumrow dt{width:92px;font-weight:900;font-size:11.5px;text-transform:uppercase;flex:none}
.sumrow dd{flex:1;min-width:0;font-weight:700}
.ticket{border:var(--bw) solid #000;border-radius:14px;background:#fff;box-shadow:var(--sh-md);overflow:hidden;position:relative}
.ticket .tp{background:var(--yellow);padding:10px 14px;border-bottom:2.5px dashed #000}
.sms{background:#e5e7eb;border:2px solid #000;border-radius:14px 14px 14px 2px;padding:10px 12px;font-weight:600;font-size:13px;max-width:92%}
.mail{border:2px solid #000;border-radius:10px;background:#fff;overflow:hidden}
.mail .mh{background:var(--ice);border-bottom:2px solid #000;padding:7px 10px;font-weight:800;font-size:12.5px}
.stars{display:flex;gap:6px}
.stars button{width:46px;height:46px;border:2.5px solid #000;border-radius:10px;background:#fff;display:grid;place-items:center;box-shadow:var(--sh-sm)}
.stars button.on{background:var(--yellow)}
.pcard-guard{background:var(--yellow);border:3px solid #000;box-shadow:var(--sh-md);border-radius:12px;text-align:center;padding:8px 14px}
.pcard-guard b{display:block;font-size:54px;line-height:1;font-weight:900}
.sticky-note{background:var(--yellow-soft);border:2px solid #000;box-shadow:var(--sh-sm);padding:10px 12px;transform:rotate(-1deg);font-weight:700}

/* owner */
.odash{display:grid;grid-template-columns:230px 1fr;min-height:100%;background:var(--ice)}
.osb{background:#fff;border-right:3px solid #000;padding:14px;display:flex;flex-direction:column;gap:10px;position:sticky;top:0;height:100%;align-self:start;min-height:calc(100dvh - 44px)}
.osb .nav{display:flex;align-items:center;gap:10px;padding:10px 12px;border:2.5px solid transparent;border-radius:10px;font-weight:800;text-transform:uppercase;text-align:left;width:100%}
.osb .nav:hover{border-color:#000}
.osb .nav.on{background:var(--yellow);border-color:#000;box-shadow:3px 3px 0 #000}
.omain{padding:18px;min-width:0;display:flex;flex-direction:column;gap:16px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpi b{display:block;font-size:34px;font-weight:900;line-height:1}
.kpi span{font-size:12px;font-weight:800;text-transform:uppercase}
.board{display:grid;grid-template-columns:54px repeat(var(--n),minmax(150px,1fr));border:var(--bw) solid #000;border-radius:12px;background:#fff;overflow:auto;box-shadow:var(--sh-md)}
.board .hd{position:sticky;top:0;background:var(--yellow);border-bottom:2.5px solid #000;border-left:2px solid #000;padding:8px;font-weight:900;text-transform:uppercase;text-align:center;z-index:3;font-size:13px}
.board .hd:first-child{border-left:0}
.board .tc{border-top:1px dashed #bbb;height:40px;font-size:10.5px;font-weight:800;padding:2px 4px;color:#444}
.bcol{position:relative;border-left:2px solid #000;height:calc(var(--rows)*40px);background:repeating-linear-gradient(#fff 0 39px,#d4d4d4 39px 40px)}
.bk{position:absolute;left:4px;right:4px;border:2px solid #000;border-radius:8px;padding:3px 7px;overflow:hidden;font-size:12px;font-weight:700;text-align:left;box-shadow:var(--sh-sm);z-index:2;line-height:1.2}
.bk:hover{z-index:4;box-shadow:var(--sh-md)}
.bk.brk{background:repeating-linear-gradient(45deg,#ddd 0 6px,#ccc 6px 12px);border-style:dashed;box-shadow:none;color:#444}
.bk .nm{font-weight:900}
.nowline{position:absolute;left:0;right:0;height:0;border-top:3px solid var(--red);z-index:5;pointer-events:none}
.nowline::before{content:"NOW";position:absolute;left:0;top:-10px;background:var(--red);color:#fff;font-size:9px;font-weight:900;padding:1px 4px}
.offcol{position:absolute;inset:0;background:repeating-linear-gradient(135deg,#eee 0 8px,#ddd 8px 16px);display:grid;place-items:center;font-weight:900;text-transform:uppercase;color:#555;z-index:1}
table.t{width:100%;border-collapse:separate;border-spacing:0;font-size:13.5px}
table.t th{background:var(--yellow);border:2px solid #000;padding:7px 8px;text-align:left;font-weight:900;text-transform:uppercase;font-size:11.5px}
table.t td{border:2px solid #000;border-top:0;padding:7px 8px;background:#fff;font-weight:600}
.scroll-x{overflow-x:auto}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.bar-lbl{font-size:12px;font-weight:800}
.heat{display:grid;gap:3px}
.footer{font-size:12px;font-weight:700;text-align:center;padding:14px;color:#000}
.cfooter{color:#fff}
/* tour */
#tour{position:fixed;inset:0;z-index:100;pointer-events:none}
#tour .hole{position:fixed;border:3px solid var(--yellow);border-radius:12px;box-shadow:0 0 0 9999px rgba(0,0,0,.62);transition:all 200ms}
#tour .tc{position:fixed;width:min(340px,calc(100vw - 20px));background:#fff;border:var(--bw) solid #000;border-radius:14px;box-shadow:var(--sh-lg);padding:14px;pointer-events:auto}
#tour .tc h3{margin-bottom:6px}
.tdots{display:flex;gap:4px;margin:8px 0}.tdots i{width:14px;height:6px;border:1.5px solid #000;background:#fff}.tdots i.on{background:var(--yellow)}

/* split + responsive */
.splitwrap{display:flex;gap:22px;align-items:flex-start;padding:18px}
.opane{flex:1;min-width:0;height:844px;overflow:auto;border:3px solid #000;border-radius:16px;box-shadow:var(--sh-xl);background:var(--ice);position:relative}
.opane .odash{grid-template-columns:170px 1fr;min-height:100%}
.opane .osb{min-height:100%;position:static;padding:10px}
.opane .osb .nav{font-size:12px;padding:8px}
.opane .kpis{grid-template-columns:repeat(2,1fr)}
@media (max-width:1023px){
  .cwrap{padding:0;display:block}
  .phone-frame{width:100%;height:100%;border:0;border-radius:0;box-shadow:none}
  .pstatus{display:none}
  .side{display:none}
}
